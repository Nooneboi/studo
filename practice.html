<link rel="icon" href="favicon.svg" type="image/svg+xml">

<meta name="description" content="Find an RLA topic, open study material, and test yourself when you are ready.">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@400;500;600&display=swap" rel="stylesheet">

<body>
<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="brand"><span class="brand-mark">&#9670;</span> Studo</a>
    <div class="header-right">
      <nav class="site-nav">
        <a href="index.html">Home</a>
        <a href="practice.html">Practice</a>

  </div>

<footer class="site-footer"><div class="wrap">Studo — built for practice, not for tracking you.</div></footer>
