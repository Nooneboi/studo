<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem("sq:theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Studo — Timed Test</title>
<meta name="description" content="A timed test simulation with one countdown and a results screen at the end.">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="focus-bar">
  <div class="wrap focus-bar-inner">
    <a href="quiz.html" class="focus-exit" id="focus-exit">&larr; Exit</a>
    <span class="focus-title" id="focus-title"></span>
    <div class="focus-tools">
      <button class="focus-icon-btn" id="text-smaller" title="Smaller text" aria-label="Smaller text">A&#8722;</button>
      <button class="focus-icon-btn" id="text-larger" title="Larger text" aria-label="Larger text">A+</button>
      <button class="focus-icon-btn" id="print-btn" title="Print this test" aria-label="Print">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/></svg>
      </button>
      <div id="theme-switch-mount"></div>
    </div>
  </div>
</header>

<main class="focus-main">
  <div class="focus-wrap">
    <div id="test-view"></div>
  </div>
</main>

<footer class="site-footer">
  <div class="focus-wrap">Answers lock once the test is submitted — explanations unlock right after.</div>
</footer>

<script src="js/app.js"></script>
<script src="js/theme.js"></script>
<script src="js/storage.js"></script>
<script src="js/data.js"></script>
<script src="js/test.js"></script>
<script src="js/focus-tools.js"></script>
</body>
</html>
