<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem("sq:theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Studo — Train Me</title>
<meta name="description" content="A focused Studo session built from review timing, weak skills, and transfer questions.">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/site.css">
</head>
<body class="focus-body train-body">

<header class="focus-bar train-focus-bar">
  <div class="wrap focus-bar-inner">
    <a href="index.html" class="focus-exit" id="focus-exit" aria-label="Exit training">&larr; Exit</a>
    <span class="focus-title" id="focus-title">Train Me</span>
    <div class="focus-tools" aria-label="Training tools">
      <span class="train-header-progress" id="train-header-progress"></span>
      <button class="focus-icon-btn" id="text-smaller" title="Smaller text" aria-label="Smaller text">A&#8722;</button>
      <button class="focus-icon-btn" id="text-larger" title="Larger text" aria-label="Larger text">A+</button>
    </div>
  </div>
</header>

<main class="focus-main">
  <div class="focus-wrap">
    <div id="train-view"></div>
  </div>
</main>

<footer class="site-footer">
  <div class="focus-wrap">Train Me chooses questions for a stated reason. You can always choose Practice manually instead.</div>
</footer>

<script src="js/app.js"></script>
<script src="js/storage.js"></script>
<script src="js/data.js"></script>
<script src="js/learning.js"></script>
<script src="js/train.js"></script>
<script src="js/focus-tools.js"></script>
<script>
</script>
</body>
</html>
